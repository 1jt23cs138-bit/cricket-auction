<!doctype html>
<html>

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Cricket Auction Live</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#172033
}

header{
  background:#18204a;
  color:#fff;
  padding:18px 16px
}

main{
  max-width:1100px;
  margin:auto;
  padding:14px
}

h1,h2{
  margin-top:0
}

.card{
  background:#fff;
  border:1px solid #dfe4ee;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(170px,1fr));
  gap:10px
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.row>*{
  flex:1;
  min-width:140px
}

input,
select,
button{
  font:inherit;
  min-height:44px;
  border:1px solid #ccd3df;
  border-radius:9px;
  padding:9px;
  background:#fff
}

button{
  font-weight:700;
  cursor:pointer
}

button:hover{
  transform:translateY(-1px)
}

.primary{
  background:#18204a;
  color:#fff
}

.value{
  font-size:25px;
  font-weight:800
}

.big{
  font-size:48px;
  font-weight:900
}

.small{
  font-size:12px;
  color:#697386
}

.notice{
  padding:10px;
  border-radius:10px;
  background:#fff8d9;
  border:1px solid #ead786
}

.live{
  background:#ffe9e9;
  border-color:#ffb7b7
}

.sold{
  background:#e8f8ec
}

.unsold{
  background:#fff0f0
}

.hidden{
  display:none!important
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#eee;
  font-size:12px
}

.status.sold{
  background:#dff5e4
}

.status.unsold{
  background:#ffe1e1
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px
}

th,td{
  padding:9px;
  border-bottom:1px solid #e6e9ef;
  text-align:left;
  font-size:13px
}

th{
  background:#f0f2f7
}

.scroll{
  overflow:auto
}

.center{
  text-align:center
}

.choice{
  padding:30px
}

.choice button{
  min-height:65px;
  font-size:18px
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap
}

.undo{
  background:#fff3cd;
  border-color:#e0b94f;
  color:#6b4d00
}

.edit{
  background:#e7f0ff;
  border-color:#9dbaf0;
  color:#173d78
}

.excel{
  background:#e5f7ea;
  border-color:#91d39f;
  color:#155b25
}

.danger{
  background:#ffe6e6;
  border-color:#e6aaaa;
  color:#8b1a1a
}


/* ==================================================
   ANIMATIONS
================================================== */

@keyframes pulseBid{

  0%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.12)
  }

  100%{
    transform:scale(1)
  }

}

@keyframes soldFlash{

  0%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.05);
    box-shadow:
      0 0 35px
      rgba(30,180,80,.5)
  }

  100%{
    transform:scale(1)
  }

}

@keyframes nextPlayer{

  0%{
    opacity:.2;
    transform:translateY(15px)
  }

  100%{
    opacity:1;
    transform:translateY(0)
  }

}

.bid-animation{
  animation:
    pulseBid .45s ease
}

.sold-animation{
  animation:
    soldFlash .8s ease
}

.next-animation{
  animation:
    nextPlayer .5s ease
}

</style>

</head>


<body>


<header>

<div class="top">

<div>

<h1>
🏏 Cricket Auction LIVE
</h1>

<div>
One link • Admin + Viewer
</div>

</div>

<div id="mode">
Viewer
</div>

</div>

</header>


<main>


<!-- ==================================================
     ENTRY
================================================== -->

<section
  id="choice"
  class="card choice center"
>

<h2>
Choose how to enter
</h2>

<div class="row">

<button
  class="primary"
  onclick="showAdmin()"
>
🔐 ADMIN
</button>

<button
  onclick="showViewer()"
>
👀 VIEW AUCTION
</button>

</div>

</section>


<!-- ==================================================
     LOGIN
================================================== -->

<section
  id="login"
  class="card hidden"
>

<h2>
Admin Login
</h2>

<input
  id="pin"
  type="password"
  inputmode="numeric"
  placeholder="Admin PIN"
>

<button
  class="primary"
  onclick="login()"
>
Enter
</button>

<p
  id="loginMsg"
  class="small"
></p>

</section>


<!-- ==================================================
     ADMIN
================================================== -->

<section
  id="admin"
  class="hidden"
>

<div class="card">

<h2>
🛠️ Admin Control
</h2>


<div class="grid">

<label>

Player

<select id="selPlayer"></select>

</label>


<label>

Bid Amount

<input
  id="amount"
  type="number"
  min="200"
  value="200"
>

</label>


<label>

Team

<select id="selTeam"></select>

</label>

</div>


<p
  id="err"
  class="notice hidden"
></p>


<div class="row">

<button
  class="primary"
  onclick="bid()"
>
📢 UPDATE LIVE BID
</button>


<button
  class="primary"
  onclick="sold()"
>
🔨 SOLD
</button>


<button
  onclick="unsold()"
>
❌ UNSOLD
</button>


<button
  onclick="next()"
>
NEXT ▶
</button>

</div>


<hr>


<!-- ==================================================
     CORRECTIONS
================================================== -->

<h3>
🔧 Corrections
</h3>


<div class="grid">

<label>

Sold Player

<select id="editPlayer"></select>

</label>


<label>

New Team

<select id="editTeam"></select>

</label>


<label>

New Bid Amount

<input
  id="editAmount"
  type="number"
  min="200"
  value="200"
>

</label>

</div>


<div class="row">

<button
  class="undo"
  onclick="undoSale()"
>
↩️ UNDO LAST ACTION
</button>


<button
  class="edit"
  onclick="editSale()"
>
✏️ SAVE EDIT
</button>

</div>


<hr>


<!-- ==================================================
     RENAME TEAMS
================================================== -->

<h3>
🏷️ Rename Teams
</h3>


<div class="grid">

<label>

Team

<select id="renameTeam"></select>

</label>


<label>

New Team Name

<input
  id="newTeamName"
  type="text"
  placeholder="Example: Royal Challengers"
>

</label>

</div>


<button
  class="edit"
  onclick="renameTeam()"
>
✏️ SAVE TEAM NAME
</button>


<hr>


<!-- ==================================================
     EXPORT
================================================== -->

<h3>
📊 Export
</h3>


<button
  class="excel"
  onclick="downloadExcel()"
>
📥 DOWNLOAD FINAL SQUADS
</button>


</div>

</section>


<!-- ==================================================
     AUCTION
================================================== -->

<section
  id="auction"
  class="hidden"
>


<div
  id="teams"
  class="grid"
></div>


<div
  id="auctionCard"
  class="card center"
>

<div class="small">
CURRENT PLAYER
</div>


<h2 id="currentPlayer"></h2>


<div
  id="currentNo"
  class="small"
></div>


<div
  id="liveBid"
  class="big"
></div>


<div id="liveTeam"></div>


<div id="result"></div>

</div>


<div class="card">

<h2>
📋 Player Results
</h2>


<div class="scroll">

<table>

<thead>

<tr>

<th>#</th>

<th>Player</th>

<th>Status</th>

<th>Team</th>

<th>Amount</th>

</tr>

</thead>


<tbody id="rows"></tbody>

</table>

</div>

</div>

</section>


</main>


<script src="/socket.io/socket.io.js"></script>


<script>

const socket =
  io();


let state =
  null;


let admin =
  false;


let adminToken =
  localStorage.getItem(
    "cricketAuctionAdminToken"
  ) || "";


const $ =
  x =>
  document.getElementById(x);


const fmt =
  n =>
  Number(
    n || 0
  ).toLocaleString(
    "en-IN"
  );


// ==================================================
// ENTRY
// ==================================================

function showAdmin(){

  $("choice")
    .classList
    .add("hidden");


  $("login")
    .classList
    .remove("hidden");


  $("mode").textContent =
    "🔐 Admin Login";


  if(adminToken){

    $("loginMsg").textContent =
      "Restoring Admin session...";


    socket.emit(
      "login",
      {
        token:
          adminToken
      }
    );

  }

}


function showViewer(){

  $("choice")
    .classList
    .add("hidden");


  $("auction")
    .classList
    .remove("hidden");


  $("mode").textContent =
    "👀 Viewer";

}


// ==================================================
// LOGIN
// ==================================================

function login(){

  const pin =
    $("pin")
      .value
      .trim();


  if(!pin){

    $("loginMsg").textContent =
      "Please enter the Admin PIN.";

    return;

  }


  $("loginMsg").textContent =
    "Checking Admin access...";


  socket.emit(
    "login",
    {

      pin:
        pin,

      token:
        adminToken

    }
  );

}


socket.on(
  "login",
  response => {


    if(
      !response ||
      response.ok !== true
    ){

      admin =
        false;


      $("loginMsg").textContent =
        response?.message ||
        "Admin login failed.";

      return;

    }


    if(response.token){

      adminToken =
        response.token;


      localStorage.setItem(
        "cricketAuctionAdminToken",
        adminToken
      );

    }


    admin =
      true;


    $("login")
      .classList
      .add("hidden");


    $("auction")
      .classList
      .remove("hidden");


    $("admin")
      .classList
      .remove("hidden");


    $("mode").textContent =
      "🔐 ADMIN";


    $("loginMsg").textContent =
      "";


    render();

  }
);


// ==================================================
// STATE
// ==================================================

socket.on(
  "update",
  s => {

    state =
      s;

    render();

  }
);


// ==================================================
// ERROR
// ==================================================

function showError(message){

  $("err").textContent =
    message;


  $("err")
    .classList
    .remove("hidden");


  setTimeout(
    () => {

      $("err")
        .classList
        .add("hidden");

    },
    3000
  );

}


socket.on(
  "errorMsg",
  showError
);


// ==================================================
// SUCCESS
// ==================================================

socket.on(
  "successMsg",
  message => {

    alert(message);

  }
);


// ==================================================
// ANIMATIONS
// ==================================================

socket.on(
  "bidAnimation",
  () => {

    $("liveBid")
      .classList
      .remove(
        "bid-animation"
      );


    void $("liveBid")
      .offsetWidth;


    $("liveBid")
      .classList
      .add(
        "bid-animation"
      );

  }
);


socket.on(
  "soldAnimation",
  () => {

    $("auctionCard")
      .classList
      .remove(
        "sold-animation"
      );


    void $("auctionCard")
      .offsetWidth;


    $("auctionCard")
      .classList
      .add(
        "sold-animation"
      );

  }
);


socket.on(
  "nextAnimation",
  () => {

    $("auctionCard")
      .classList
      .remove(
        "next-animation"
      );


    void $("auctionCard")
      .offsetWidth;


    $("auctionCard")
      .classList
      .add(
        "next-animation"
      );

  }
);


socket.on(
  "unsoldAnimation",
  () => {

    $("auctionCard")
      .classList
      .remove(
        "sold-animation"
      );


    void $("auctionCard")
      .offsetWidth;


    $("auctionCard")
      .classList
      .add(
        "sold-animation"
      );

  }
);


socket.on(
  "undoAnimation",
  () => {

    $("auctionCard")
      .classList
      .remove(
        "next-animation"
      );


    void $("auctionCard")
      .offsetWidth;


    $("auctionCard")
      .classList
      .add(
        "next-animation"
      );

  }
);


socket.on(
  "editAnimation",
  () => {

    $("auctionCard")
      .classList
      .remove(
        "bid-animation"
      );


    void $("auctionCard")
      .offsetWidth;


    $("auctionCard")
      .classList
      .add(
        "bid-animation"
      );

  }
);


// ==================================================
// RENDER
// ==================================================

function render(){

  if(!state)
    return;


  const p =
    state.players[
      state.current
    ];


  if(!p)
    return;


  // ==================================================
  // TEAMS
  // ==================================================

  $("teams").innerHTML =
    state.teams
      .map(
        t => `

        <div class="card">

          <h3>
            ${t.name}
          </h3>

          <div class="small">
            REMAINING
          </div>

          <div class="value">
            ${fmt(
              t.budget -
              t.spent
            )}
          </div>

          <div class="small">

            Spent
            ${fmt(t.spent)}

            •
            ${t.players.length}
            players

          </div>


          ${
            t.players.length

            ?

            `

            <div
              style="margin-top:12px"
            >

              <b>
                Players Bought
              </b>


              <div class="scroll">

                <table
                  style="min-width:100%"
                >

                  <thead>

                    <tr>

                      <th>
                        Player
                      </th>

                      <th>
                        Bid
                      </th>

                    </tr>

                  </thead>


                  <tbody>

                    ${
                      t.players
                        .map(
                          player => `

                        <tr>

                          <td>
                            ${player.name}
                          </td>

                          <td>
                            ${fmt(
                              player.amount
                            )}
                          </td>

                        </tr>

                      `
                        )
                        .join("")
                    }

                  </tbody>

                </table>

              </div>

            </div>

            `

            :

            `

            <div
              class="small"
              style="margin-top:12px"
            >
              No players bought yet
            </div>

            `
          }

        </div>

      `
      )
      .join("");


  // ==================================================
  // CURRENT PLAYER
  // ==================================================

  $("currentPlayer")
    .textContent =
    p.name;


  $("currentNo")
    .textContent =
    `Player ${
      state.current + 1
    } of ${
      state.players.length
    } • ${p.status}`;


  $("liveBid")
    .textContent =
    fmt(
      state.liveBid ||
      200
    );


  if(
    state.liveBidTeam !== "" &&
    state.liveBidTeam !== null &&
    state.teams[
      state.liveBidTeam
    ]
  ){

    $("liveTeam")
      .textContent =
      "Current bid: " +
      state.teams[
        state.liveBidTeam
      ].name;

  }
  else{

    $("liveTeam")
      .textContent =
      "Base price: 200";

  }


  // ==================================================
  // RESULT
  // ==================================================

  if(
    p.status ===
    "sold"
  ){

    $("result")
      .innerHTML = `

      <div class="notice sold">

        🔨 SOLD —
        ${p.team}
        for
        ${fmt(p.amount)}
        points

      </div>

    `;

  }

  else if(
    p.status ===
    "unsold"
  ){

    $("result")
      .innerHTML = `

      <div class="notice unsold">

        ❌ UNSOLD

      </div>

    `;

  }

  else{

    $("result")
      .innerHTML = `

      <div class="notice live">

        🔴 BIDDING LIVE

      </div>

    `;

  }


  // ==================================================
  // PLAYER RESULTS
  // ==================================================

  $("rows")
    .innerHTML =
    state.players
      .map(
        (player, i) => `

        <tr>

          <td>
            ${i + 1}
          </td>

          <td>
            ${player.name}
          </td>

          <td>

            <span
              class="status ${
                player.status
              }"
            >

              ${player.status}

            </span>

          </td>

          <td>
            ${player.team || "-"}
          </td>

          <td>

            ${
              player.amount
              ?
              fmt(player.amount)
              :
              "-"
            }

          </td>

        </tr>

      `
      )
      .join("");


  // ==================================================
  // ADMIN CONTROLS
  // ==================================================

  if(admin){

    // Player
    $("selPlayer")
      .innerHTML =
      state.players
        .map(
          (player, i) => `

          <option
            value="${i}"
            ${
              i ===
              state.current
              ?
              "selected"
              :
              ""
            }
          >

            ${i + 1}.
            ${player.name}
            —
            ${player.status}

          </option>

        `
        )
        .join("");


    // Team
    $("selTeam")
      .innerHTML =
      state.teams
        .map(
          (team, i) => `

          <option
            value="${i}"
            ${
              i ===
              Number(
                state.liveBidTeam
              )
              ?
              "selected"
              :
              ""
            }
          >

            ${team.name}
            (
            ${fmt(
              team.budget -
              team.spent
            )}
            left)

          </option>

        `
        )
        .join("");


    $("amount")
      .value =
      state.liveBid ||
      200;


    // ==================================================
    // EDIT PLAYER
    // ==================================================

    const soldPlayers =
      state.players.filter(
        player =>
          player.status ===
          "sold"
      );


    $("editPlayer")
      .innerHTML =
      soldPlayers.length

      ?

      soldPlayers
        .map(
          player => {

            const index =
              state.players
                .indexOf(
                  player
                );


            return `

              <option
                value="${index}"
              >

                ${index + 1}.
                ${player.name}
                —
                ${player.team}
                —
                ${fmt(
                  player.amount
                )}

              </option>

            `;

          }
        )
        .join("")

      :

      `

      <option value="">
        No sold players
      </option>

      `;


    // ==================================================
    // EDIT TEAM
    // ==================================================

    $("editTeam")
      .innerHTML =
      state.teams
        .map(
          (team, i) => `

          <option
            value="${i}"
          >

            ${team.name}
            (
            ${fmt(
              team.budget -
              team.spent
            )}
            left)

          </option>

        `
        )
        .join("");


    // ==================================================
    // RENAME TEAM
    // ==================================================

    $("renameTeam")
      .innerHTML =
      state.teams
        .map(
          (team, i) => `

          <option
            value="${i}"
          >

            ${team.name}

          </option>

        `
        )
        .join("");

  }

}


// ==================================================
// BID
// ==================================================

function bid(){

  if(!admin)
    return;


  socket.emit(
    "bid",
    {

      amount:
        $("amount").value,

      team:
        $("selTeam").value

    }
  );

}


// ==================================================
// SOLD
// ==================================================

function sold(){

  if(!admin)
    return;


  if(
    !confirm(
      "Sell this player with the selected team and bid?"
    )
  ){

    return;

  }


  socket.emit(
    "sold",
    {

      amount:
        $("amount").value,

      team:
        $("selTeam").value

    }
  );

}


// ==================================================
// UNSOLD
// ==================================================

function unsold(){

  if(!admin)
    return;


  if(
    !confirm(
      "Mark this player as UNSOLD?"
    )
  ){

    return;

  }


  socket.emit(
    "unsold"
  );

}


// ==================================================
// NEXT
// ==================================================

function next(){

  if(!admin)
    return;


  socket.emit(
    "next"
  );

}


// ==================================================
// UNDO
// ==================================================

function undoSale(){

  if(!admin)
    return;


  if(
    !confirm(
      "Undo the LAST ACTION?\n\n" +
      "The previous change will be reversed."
    )
  ){

    return;

  }


  socket.emit(
    "undoSale"
  );

}


// ==================================================
// EDIT SALE
// ==================================================

function editSale(){

  if(!admin)
    return;


  const playerIndex =
    $("editPlayer").value;


  if(
    playerIndex === ""
  ){

    showError(
      "There are no sold players to edit."
    );

    return;

  }


  const player =
    state.players[
      Number(
        playerIndex
      )
    ];


  const teamIndex =
    Number(
      $("editTeam").value
    );


  const amount =
    Number(
      $("editAmount").value
    );


  if(!player){

    showError(
      "Player not found."
    );

    return;

  }


  if(
    !amount ||
    amount < 200
  ){

    showError(
      "Minimum bid is 200."
    );

    return;

  }


  if(
    !confirm(
      `Edit ${player.name}?\n\n` +
      `New team: ${
        state.teams[
          teamIndex
        ].name
      }\n` +
      `New bid: ${amount}`
    )
  ){

    return;

  }


  socket.emit(
    "editSale",
    {

      playerIndex:
        Number(
          playerIndex
        ),

      teamIndex:
        teamIndex,

      amount:
        amount

    }
  );

}


// ==================================================
// EDIT PLAYER CHANGE
// ==================================================

$("editPlayer")
  .addEventListener(
    "change",
    () => {

      if(!state)
        return;


      const index =
        Number(
          $("editPlayer").value
        );


      const p =
        state.players[
          index
        ];


      if(!p)
        return;


      $("editAmount")
        .value =
        p.amount ||
        200;


      const teamIndex =
        state.teams.findIndex(
          team =>
            team.name ===
            p.team
        );


      if(
        teamIndex >= 0
      ){

        $("editTeam")
          .value =
          teamIndex;

      }

    }
  );


// ==================================================
// PLAYER SELECTION
// ==================================================

$("selPlayer")
  .addEventListener(
    "change",
    () => {

      if(!admin)
        return;


      socket.emit(
        "select",
        Number(
          $("selPlayer").value
        )
      );

    }
  );


// ==================================================
// RENAME TEAM
// ==================================================

function renameTeam(){

  if(!admin)
    return;


  const teamIndex =
    Number(
      $("renameTeam").value
    );


  const newName =
    $("newTeamName")
      .value
      .trim();


  if(!newName){

    showError(
      "Please enter a team name."
    );

    return;

  }


  const team =
    state.teams[
      teamIndex
    ];


  if(!team){

    showError(
      "Team not found."
    );

    return;

  }


  if(
    !confirm(
      `Rename "${team.name}" to "${newName}"?`
    )
  ){

    return;

  }


  socket.emit(
    "renameTeam",
    {

      teamIndex:
        teamIndex,

      newName:
        newName

    }
  );


  $("newTeamName")
    .value = "";

}


// ==================================================
// EXCEL / CSV DOWNLOAD
// ==================================================

function downloadExcel(){

  if(!admin)
    return;


  if(!state){

    alert(
      "Auction data is not available."
    );

    return;

  }


  let csv = "";


  csv +=
    "CRICKET AUCTION FINAL SQUADS\n\n";


  // Team summary
  csv +=
    "Team,Players Bought,Total Spent,Remaining Points\n";


  state.teams.forEach(
    team => {

      csv +=
        `"${team.name}",` +
        `${team.players.length},` +
        `${team.spent},` +
        `${team.budget -
          team.spent}\n`;

    }
  );


  csv +=
    "\n\n";


  // Squad details
  csv +=
    "Team,Player,Bid Amount\n";


  state.teams.forEach(
    team => {

      team.players.forEach(
        player => {

          csv +=
            `"${team.name}",` +
            `"${player.name}",` +
            `${player.amount}\n`;

        }
      );

    }
  );


  csv +=
    "\n\n";


  // All players
  csv +=
    "Player,Status,Team,Bid Amount\n";


  state.players.forEach(
    player => {

      csv +=
        `"${player.name}",` +
        `"${player.status}",` +
        `"${player.team || ""}",` +
        `${player.amount || ""}\n`;

    }
  );


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    "Cricket_Auction_Final_Squads.csv";


  document.body.appendChild(
    a
  );


  a.click();


  document.body.removeChild(
    a
  );


  URL.revokeObjectURL(
    url
  );

}


// ==================================================
// ENTER KEY
// ==================================================

$("pin")
  .addEventListener(
    "keydown",
    e => {

      if(
        e.key ===
        "Enter"
      ){

        login();

      }

    }
  );

</script>
