.logo{

.mode{

  backdrop-filter:blur(10px);
}


/* ==================================================
   MAIN
================================================== */

main{

  width:100%;
  max-width:1250px;

  padding:24px 18px 60px;

/* ==================================================
   CARD
================================================== */

.card{

  background:

  border:

   ENTRY
================================================== */

.choice{

  max-width:650px;

  margin:

  text-align:center;

  padding:45px 30px;
}

.choice h2{

  font-size:30px;

  margin-bottom:25px;
}


/* ==================================================
   BUTTONS
================================================== */

button,
input,
select{

  font:inherit;

  min-height:46px;

  border-radius:11px;

  border:
    1px solid #ccd4e4;

  padding:10px 14px;

  background:white;
}

button{

  cursor:pointer;

  font-weight:800;

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    filter .15s ease;
}

button:hover{

  transform:translateY(-2px);

  box-shadow:
    0 8px 18px rgba(30,45,80,.12);
}

button:active{

  transform:translateY(0);
}

.primary{

  color:white;

  border:none;

  background:
    linear-gradient(
      135deg,
      #172052,
      #293b8f
    );

  box-shadow:
    0 7px 20px rgba(24,32,74,.25);
}

.sold-btn{

  color:white;

  border:none;

  background:
    linear-gradient(
      135deg,
      #0c9b50,
      #19c66b
    );

  box-shadow:
    0 8px 22px rgba(15,170,85,.28);

  font-size:18px;

  min-height:58px;
}

.next-btn{

  color:white;

  border:none;

  background:
    linear-gradient(
      135deg,
      #172052,
      #4056b5
    );

  font-size:18px;

  min-height:58px;
}

.unsold-btn{

  background:
    #fff1f1;

  color:#a01b1b;

  border:
    1px solid #efb0b0;
}

.undo{

  background:#fff5d8;

  border-color:#e4bd54;

  color:#725100;
}

.rename{

  background:#edf3ff;

  border-color:#adc2f0;

  color:#1e4285;
}

.excel{

  background:#e9f8ed;

  border-color:#9ed7aa;

  color:#176129;
}


/* ==================================================
   GRID
================================================== */

.grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(190px,1fr)
    );

  gap:14px;
}

.row{

  display:flex;

  gap:10px;

  flex-wrap:wrap;
}

.row>*{

  flex:1;

  min-width:140px;
}


/* ==================================================
   CURRENT PLAYER HERO
================================================== */

.auction-hero{

  position:relative;

  overflow:hidden;

  text-align:center;

  padding:
    30px 22px 25px;

  color:white;

  background:
    radial-gradient(
      circle at 50% -30%,
      rgba(255,193,7,.30),
      transparent 40%
    ),
    linear-gradient(
      135deg,
      #080d2d,
      #111b4d 55%,
      #202f72
    );

  border:
    1px solid rgba(255,255,255,.12);

  border-radius:28px;

  box-shadow:
    0 18px 50px rgba(12,20,60,.28);
}

.auction-hero::before{

  content:"";

  position:absolute;

  width:280px;
  height:280px;

  border-radius:50%;

  top:-160px;
  left:-80px;

  background:
    rgba(255,193,7,.10);

  filter:blur(4px);
}

.auction-hero::after{

  content:"";

  position:absolute;

  width:240px;
  height:240px;

  border-radius:50%;

  bottom:-160px;
  right:-60px;

  background:
    rgba(80,110,255,.18);
}

.live-label{

  position:relative;
  z-index:2;

  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:7px 13px;

  border-radius:30px;

  background:
    rgba(255,255,255,.10);

  border:
    1px solid rgba(255,255,255,.18);

  font-size:12px;

  font-weight:900;

  letter-spacing:1.2px;

  color:#e9edff;
}

.live-dot{

  width:8px;
  height:8px;

  border-radius:50%;

  background:#ff4d5e;

  box-shadow:
    0 0 12px #ff4d5e;

  animation:livePulse 1.3s infinite;
}

@keyframes livePulse{

  0%,100%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.45);
    opacity:.65;
  }
}

.current-label{

  position:relative;
  z-index:2;

  margin-top:18px;

  color:#aeb9df;

  font-size:12px;

  letter-spacing:2px;

  font-weight:800;
}

.current-player-name{

  position:relative;
  z-index:2;

  margin:7px 0 4px;

  font-size:
    clamp(34px,6vw,64px);

  line-height:1;

  font-weight:950;

  letter-spacing:-1.5px;

  text-shadow:
    0 5px 25px rgba(0,0,0,.35);
}

.player-number{

  position:relative;
  z-index:2;

  color:#aeb9df;

  font-size:13px;
}


/* ==================================================
   BID DISPLAY
================================================== */

.bid-area{

  position:relative;
  z-index:2;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:20px;

  margin:

.bid-box{

  border:

  backdrop-filter:blur(10px);
}

.bid-title{

  color:#aeb9df;

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:1.5px;
}

.big-bid{

  margin-top:4px;

  font-size:34px;

  font-weight:950;

  color:#ffd45a;

  text-shadow:
    0 0 25px rgba(255,193,7,.18);
}

.bid-team{

  margin-top:4px;

  color:white;

  font-weight:800;
}


/* ==================================================
   HERO ACTIONS
================================================== */

.hero-actions{

  position:relative;
  z-index:2;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

  max-width:700px;

  margin:20px auto 0;
}

.hero-actions button{

}


/* ==================================================
   ADMIN CONTROL
================================================== */

.admin-title{

}

.admin-title h2{

}

.control-grid{

  grid-template-columns:
    1.4fr .8fr 1fr;

  gap:12px;
}

label{

  flex-direction:column;

  gap:7px;

  font-weight:700;

  font-size:13px;
}

label span{

  font-size:12px;
}

.admin-actions{

}


/* ==================================================
   TEAM CARDS
================================================== */

.team-section-title{

.team-card:nth-child(2){

.team-card::after{

}

.team-name{

  font-size:19px;

}

}

.remaining{

  margin-top:3px;

.team-meta{

}

.results-title{

}

.status{

}

.status.sold{

  color:#13733a;
}

.status.unsold{

}

================================================== */

.correction-actions{

  gap:10px;

  margin-top:12px;
}


/* ==================================================
   RENAME
================================================== */

.rename-grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;
}


/* ==================================================
   NOTICE
================================================== */

.notice{

  padding:12px;

  border-radius:12px;

  background:#fff8d9;

  border:1px solid #ead786;

  margin-top:12px;
}

.live{

  background:#fff0f0;

  border-color:#ffb9b9;

  color:#a11e1e;
}

.sold{

  background:#e8f8ec;

  border-color:#a8ddb5;

  color:#146b32;
}

.unsold{

  background:#fff0f0;

  border-color:#f1b4b4;

  color:#9b2020;
}

.small{

  font-size:12px;

  color:#697386;
}

.hidden{

  display:none!important;
}


/* ==================================================
   ANIMATIONS
================================================== */

@keyframes bidPulse{

  0%{
    transform:scale(1);
  }

  45%{
    transform:scale(1.08);
  }

  100%{
    transform:scale(1);
  }
}

@keyframes soldFlash{

  0%{
    transform:scale(1);
    box-shadow:
      0 18px 50px rgba(12,20,60,.28);
  }

  35%{
    transform:scale(1.025);

    box-shadow:
      0 0 60px rgba(40,220,120,.55);
  }

  70%{
    transform:scale(1.01);
  }

  100%{
    transform:scale(1);
  }
}

@keyframes playerEnter{

  0%{
    opacity:0;
    transform:
      translateY(25px)
      scale(.97);
  }

  100%{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}

@keyframes unsoldFlash{

  0%{
    box-shadow:
      0 18px 50px rgba(12,20,60,.28);
  }

  50%{
    box-shadow:
      0 0 55px rgba(255,70,70,.5);
  }

  100%{
    box-shadow:
      0 18px 50px rgba(12,20,60,.28);
  }
}

.bid-animation{

  animation:
    bidPulse .45s ease;
}

.sold-animation{

  animation:
    soldFlash .9s ease;
}

.next-animation{

  animation:
    playerEnter .55s ease;
}

.unsold-animation{

  animation:
    unsoldFlash .8s ease;
}


/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:850px){

  .control-grid{

    grid-template-columns:1fr;
  }

  .admin-actions{

    grid-template-columns:1fr;
  }

  .correction-grid,
  .rename-grid{

    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{

    padding:14px;
  }

  .logo-title{

    font-size:19px;
  }

  .logo{

    width:43px;
    height:43px;

    font-size:22px;
  }

  main{

    padding:
      14px 10px 40px;
  }

  .card{

    border-radius:17px;

    padding:14px;
  }

  .auction-hero{

    border-radius:21px;

    padding:
      25px 13px 18px;
  }

  .hero-actions{

    grid-template-columns:1fr;
  }

  .bid-box{

    min-width:180px;
  }

  .current-player-name{

    font-size:38px;
  }

  .mode{

    font-size:11px;

    padding:7px 10px;
  }

}


/* ==================================================
   PRINT
================================================== */

@media print{

  header,
  #admin,
  #choice,
  #login{

    display:none!important;
  }

  body{

    background:white;
  }

  .card{

    box-shadow:none;
  }

}

</style>

</head>
