<!doctype html>
<html>

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Cricket Auction LIVE</title>

<style>

/* ==================================================
   GLOBAL
================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;
  background:
    linear-gradient(
      135deg,
      #f5f7fb,
      #eef2f8
    );
  color:#172033;
}


/* ==================================================
   HEADER
================================================== */

header{
  background:
    linear-gradient(
      135deg,
      #10183d,
      #202b67
    );
  color:#fff;
  padding:22px 20px;
  box-shadow:
    0 4px 18px rgba(0,0,0,.15);
}

.top{
  max-width:1200px;
  margin:auto;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:20px;
  flex-wrap:wrap;
}

.logo-area h1{
  margin:0;
  font-size:30px;
  letter-spacing:-.5px;
}

.logo-sub{
  margin-top:5px;
  opacity:.8;
  font-size:14px;
}

.mode{
  padding:10px 16px;
  border-radius:30px;

  background:
    rgba(255,255,255,.12);

  border:
    1px solid rgba(255,255,255,.2);

  font-weight:700;
}


/* ==================================================
   MAIN
================================================== */

main{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

h1,
h2,
h3{
  margin-top:0;
}


/* ==================================================
   CARDS
================================================== */

.card{
  background:#fff;

  border:
    1px solid #e0e5ef;

  border-radius:18px;

  padding:18px;

  margin-bottom:16px;

  box-shadow:
    0 5px 20px rgba(25,35,60,.06);
}


/* ==================================================
   ENTRY
================================================== */

.choice{
  max-width:700px;
  margin:50px auto;

  padding:45px 30px;

  text-align:center;
}

.choice h2{
  font-size:28px;
}

.choice button{
  min-height:60px;
  font-size:17px;
}


/* ==================================================
   GRID
================================================== */

.grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(190px,1fr)
    );

  gap:12px;
}


/* ==================================================
   FLEX ROW
================================================== */

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
  min-width:140px;
}


/* ==================================================
   INPUTS
================================================== */

input,
select,
button{

  font:inherit;

  min-height:46px;

  border:
    1px solid #ccd4e2;

  border-radius:10px;

  padding:10px 13px;

  background:#fff;

  transition:
    .2s ease;
}

input:focus,
select:focus{

  outline:none;

  border-color:#536dfe;

  box-shadow:
    0 0 0 3px
    rgba(83,109,254,.12);
}


/* ==================================================
   BUTTONS
================================================== */

button{

  font-weight:700;

  cursor:pointer;

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    background .15s ease;
}

button:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 5px 14px
    rgba(0,0,0,.10);
}

button:active{

  transform:
    translateY(0);
}

.primary{

  background:
    linear-gradient(
      135deg,
      #18204a,
      #28356f
    );

  color:#fff;

  border:none;
}


/* ==================================================
   ADMIN SECTION
================================================== */

.admin-title{

  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:18px;
}

.admin-title h2{
  margin:0;
}


/* ==================================================
   LIVE BADGE
================================================== */

.live-badge{

  display:inline-flex;

  align-items:center;

  gap:7px;

  padding:
    6px 11px;

  border-radius:20px;

  background:#ffe9e9;

  color:#c62828;

  font-size:12px;

  font-weight:800;

  letter-spacing:.4px;
}

.live-dot{

  width:8px;
  height:8px;

  background:#e53935;

  border-radius:50%;

  animation:
    livePulse 1.2s infinite;
}

@keyframes livePulse{

  0%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.45;
    transform:scale(.75);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }

}


/* ==================================================
   AUCTION BUTTONS
================================================== */

.auction-actions{
  display:grid;

  grid-template-columns:
    1.4fr
    1fr
    1fr
    1fr;

  gap:10px;

  margin-top:15px;
}

@media(max-width:700px){

  .auction-actions{
    grid-template-columns:
      1fr 1fr;
  }

}


/* ==================================================
   CORRECTIONS
================================================== */

.correction-title{

  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:12px;
}

.correction-title h3{
  margin:0;
}

.correction-actions{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:12px;
}

.undo{

  background:#fff4d6;

  border-color:#e4bd54;

  color:#684d00;
}

.edit{

  background:#e8f0ff;

  border-color:#a8bff0;

  color:#173d78;
}

.excel{

  background:#e8f7eb;

  border-color:#9bd4a6;

  color:#155b25;
}

.rename{

  background:#f0eaff;

  border-color:#c4b0ed;

  color:#542b91;
}


/* ==================================================
   TEAM CARDS
================================================== */

.team-card{

  position:relative;

  overflow:hidden;

  min-height:230px;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.team-card:hover{

  transform:
    translateY(-3px);

  box-shadow:
    0 10px 28px
    rgba(20,30,60,.10);
}

.team-top{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:8px;
}

.team-name{

  font-size:18px;

  font-weight:800;
}

.team-budget{

  font-size:27px;

  font-weight:900;

  margin:
    5px 0;
}

.team-label{

  color:#718096;

  font-size:11px;

  text-transform:
    uppercase;

  letter-spacing:.6px;
}

.team-meta{

  color:#667085;

  font-size:12px;
}

.team-divider{

  height:1px;

  background:#e8ebf1;

  margin:
    13px 0;
}

.bought-title{

  font-weight:800;

  font-size:13px;

  margin-bottom:6px;
}


/* ==================================================
   AUCTION STAGE
================================================== */

.auction-stage{

  position:relative;

  text-align:center;

  padding:
    35px 20px 30px;

  overflow:hidden;
}

.stage-label{

  color:#718096;

  font-size:12px;

  font-weight:700;

  letter-spacing:1.5px;

  text-transform:uppercase;
}

.current-player{

  font-size:
    clamp(
      30px,
      5vw,
      52px
    );

  font-weight:900;

  margin:
    5px 0;

  letter-spacing:-1px;
}

.player-number{

  color:#718096;

  font-size:13px;
}

.live-price{

  font-size:
    clamp(
      48px,
      8vw,
      78px
    );

  font-weight:950;

  letter-spacing:-2px;

  margin:
    8px 0;

  color:#18204a;
}

.live-team{

  font-size:16px;

  font-weight:700;

  color:#4b5565;
}


/* ==================================================
   RESULT
================================================== */

.notice{

  padding:12px 15px;

  border-radius:11px;

  margin-top:15px;

  font-weight:700;
}

.live{

  background:#fff0f0;

  border:
    1px solid #ffc2c2;

  color:#b42318;
}

.sold{

  background:#e8f8ec;

  border:
    1px solid #a8ddb3;

  color:#146c2e;
}

.unsold{

  background:#fff0f0;

  border:
    1px solid #ffc2c2;

  color:#a51d2d;
}


/* ==================================================
   VALUES
================================================== */

.value{

  font-size:25px;

  font-weight:900;
}

.small{

  font-size:12px;

  color:#697386;
}


/* ==================================================
   TABLE
================================================== */

table{

  width:100%;

  border-collapse:
    collapse;

  min-width:650px;
}

th,
td{

  padding:11px;

  border-bottom:
    1px solid #e6e9ef;

  text-align:left;

  font-size:13px;
}

th{

  background:#f2f4f8;

  font-weight:800;
}

tr:hover td{

  background:#fafbfc;
}

.scroll{

  overflow:auto;
}


/* ==================================================
   STATUS
================================================== */

.status{

  display:inline-block;

  padding:
    5px 10px;

  border-radius:20px;

  background:#edf0f4;

  font-size:11px;

  font-weight:800;

  text-transform:uppercase;
}

.status.sold{

  background:#dff5e4;

  color:#146c2e;
}

.status.unsold{

  background:#ffe1e1;

  color:#a51d2d;
}

.status.pending{

  background:#edf0f4;

  color:#5b6472;
}


/* ==================================================
   HIDDEN
================================================== */

.hidden{
  display:none!important;
}

.center{
  text-align:center;
}


/* ==================================================
   ANIMATIONS
================================================== */

@keyframes pulseBid{

  0%{
    transform:scale(1);
  }

  45%{
    transform:scale(1.12);
  }

  100%{
    transform:scale(1);
  }

}

@keyframes soldFlash{

  0%{
    transform:scale(1);
    box-shadow:
      0 0 0 rgba(0,0,0,0);
  }

  45%{
    transform:scale(1.035);

    box-shadow:
      0 0 45px
      rgba(35,190,90,.45);
  }

  100%{
    transform:scale(1);

    box-shadow:
      0 0 0 rgba(0,0,0,0);
  }

}

@keyframes nextPlayer{

  0%{
    opacity:.2;
    transform:
      translateY(20px);
  }

  100%{
    opacity:1;
    transform:
      translateY(0);
  }

}

.bid-animation{

  animation:
    pulseBid .45s ease;
}

.sold-animation{

  animation:
    soldFlash .8s ease;
}

.next-animation{

  animation:
    nextPlayer .5s ease;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:600px){

  main{
    padding:10px;
  }

  header{
    padding:16px;
  }

  .logo-area h1{
    font-size:23px;
  }

  .card{
    padding:14px;
    border-radius:14px;
  }

  .correction-actions{
    grid-template-columns:1fr;
  }

  .auction-stage{
    padding:
      28px 12px;
  }

}

</style>

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header>

<div class="top">

<div class="logo-area">

<h1>
🏏 Cricket Auction LIVE
</h1>

<div class="logo-sub">
Professional Live Player Auction
</div>

</div>

<div
  id="mode"
  class="mode"
>
Viewer
</div>

</div>

</header>


<main>


<!-- ==================================================
     ENTRY
================================================== -->

<section
  id="choice"
  class="card choice"
>

<h2>
🏏 Enter Cricket Auction
</h2>

<p class="small">
Choose your access mode
</p>

<div class="row">

<button
  class="primary"
  onclick="showAdmin()"
>
🔐 ADMIN
</button>

<button
  onclick="showViewer()"
>
👀 VIEW AUCTION
</button>

</div>

</section>


<!-- ==================================================
     LOGIN
================================================== -->

<section
  id="login"
  class="card hidden"
>

<h2>
🔐 Admin Login
</h2>

<input
  id="pin"
  type="password"
  inputmode="numeric"
  placeholder="Enter Admin PIN"
>

<button
  class="primary"
  onclick="login()"
>
Enter Auction
</button>

<p
  id="loginMsg"
  class="small"
></p>

</section>


<!-- ==================================================
     ADMIN
================================================== -->

<section
  id="admin"
  class="hidden"
>

<div class="card">

<div class="admin-title">

<h2>
🛠️ Auction Control
</h2>

<span class="live-badge">
<span class="live-dot"></span>
LIVE
</span>

</div>


<div class="grid">


<label>

Player

<select id="selPlayer"></select>

</label>


<label>

Bid Amount

<input
  id="amount"
  type="number"
  min="200"
  value="200"
>

</label>


<label>

Team

<select id="selTeam"></select>

</label>


</div>


<p
  id="err"
  class="notice hidden"
></p>


<div class="auction-actions">

<button
  class="primary"
  onclick="bid()"
>
📢 UPDATE BID
</button>


<button
  class="primary"
  onclick="sold()"
>
🔨 SOLD
</button>


<button
  onclick="unsold()"
>
❌ UNSOLD
</button>


<button
  onclick="next()"
>
NEXT ▶
</button>

</div>


<hr>


<!-- ==================================================
     CORRECTIONS
================================================== -->

<div class="correction-title">

<h3>
🔧 Corrections
</h3>

</div>


<div class="grid">

<label>

Sold Player

<select id="editPlayer"></select>

</label>

</div>


<div class="correction-actions">

<button
  class="undo"
  onclick="undoSale()"
>
↩️ UNDO LAST SALE
</button>


<button
  class="edit"
  onclick="editSale()"
>
✏️ EDIT SALE
</button>

</div>


<hr>


<!-- ==================================================
     RENAME
================================================== -->

<div class="correction-title">

<h3>
🏷️ Rename Teams
</h3>

</div>


<div class="grid">

<label>

Team

<select id="renameTeam"></select>

</label>


<label>

New Team Name

<input
  id="newTeamName"
  type="text"
  placeholder="Example: Royal Challengers"
>

</label>

</div>


<button
  class="rename"
  onclick="renameTeam()"
>
✏️ SAVE TEAM NAME
</button>


<hr>


<!-- ==================================================
     EXPORT
================================================== -->

<div class="correction-title">

<h3>
📊 Export
</h3>

</div>


<button
  class="excel"
  onclick="downloadExcel()"
>
📥 DOWNLOAD FINAL SQUADS
</button>

</div>

</section>


<!-- ==================================================
     AUCTION
================================================== -->

<section
  id="auction"
  class="hidden"
>


<!-- ==================================================
     TEAMS
================================================== -->

<div
  id="teams"
  class="grid"
></div>


<!-- ==================================================
     CURRENT PLAYER
================================================== -->

<div
  id="auctionCard"
  class="card auction-stage"
>

<div class="stage-label">
CURRENT PLAYER
</div>


<div
  id="currentPlayer"
  class="current-player"
></div>


<div
  id="currentNo"
  class="player-number"
></div>


<div
  id="liveBid"
  class="live-price"
></div>


<div
  id="liveTeam"
  class="live-team"
></div>


<div id="result"></div>

</div>


<!-- ==================================================
     PLAYER RESULTS
================================================== -->

<div class="card">

<h2>
📋 Auction Results
</h2>

<div class="scroll">

<table>

<thead>

<tr>

<th>#</th>

<th>Player</th>

<th>Status</th>

<th>Team</th>

<th>Amount</th>

</tr>

</thead>


<tbody
  id="rows"
></tbody>

</table>

</div>

</div>


</section>

</main>


<script src="/socket.io/socket.io.js"></script>


<script>

const socket = io();

let state = null;

let admin = false;


let adminToken =
  localStorage.getItem(
    "cricketAuctionAdminToken"
  ) || "";


const $ =
  x => document.getElementById(x);


const fmt =
  n =>
    Number(n || 0)
      .toLocaleString("en-IN");


// ==================================================
// ENTRY
// ==================================================

function showAdmin(){

  $("choice")
    .classList
    .add("hidden");

  $("login")
    .classList
    .remove("hidden");

  $("mode").textContent =
    "🔐 Admin Login";


  if(adminToken){

    $("loginMsg").textContent =
      "Restoring Admin session...";


    socket.emit("login", {
      token:adminToken
    });

  }

}


function showViewer(){

  $("choice")
    .classList
    .add("hidden");

  $("auction")
    .classList
    .remove("hidden");

  $("mode").textContent =
    "👀 Viewer";

}


// ==================================================
// LOGIN
// ==================================================

function login(){

  const pin =
    $("pin").value.trim();


  if(!pin){

    $("loginMsg").textContent =
      "Please enter the Admin PIN.";

    return;
  }


  $("loginMsg").textContent =
    "Checking Admin access...";


  socket.emit("login", {

    pin:pin,

    token:adminToken

  });

}


socket.on("login", response => {

  if(
    !response ||
    response.ok !== true
  ){

    admin = false;

    $("loginMsg").textContent =
      response?.message ||
      "Admin login failed.";

    return;
  }


  if(response.token){

    adminToken =
      response.token;


    localStorage.setItem(
      "cricketAuctionAdminToken",
      adminToken
    );

  }


  admin = true;


  $("login")
    .classList
    .add("hidden");


  $("auction")
    .classList
    .remove("hidden");


  $("admin")
    .classList
    .remove("hidden");


  $("mode").textContent =
    "🔐 ADMIN";


  render();

});


// ==================================================
// STATE
// ==================================================

socket.on("update", s => {

  state = s;

  render();

});


// ==================================================
// ERROR
// ==================================================

function showError(message){

  $("err").textContent =
    message;

  $("err")
    .classList
    .remove("hidden");


  setTimeout(() => {

    $("err")
      .classList
      .add("hidden");

  },3000);

}


socket.on(
  "errorMsg",
  showError
);


// ==================================================
// BID ANIMATION
// ==================================================

socket.on(
  "bidAnimation",
  () => {

    const el =
      $("liveBid");

    el.classList.remove(
      "bid-animation"
    );

    void el.offsetWidth;

    el.classList.add(
      "bid-animation"
    );

  }
);


// ==================================================
// SOLD ANIMATION
// ==================================================

socket.on(
  "soldAnimation",
  () => {

    const el =
      $("auctionCard");

    el.classList.remove(
      "sold-animation"
    );

    void el.offsetWidth;

    el.classList.add(
      "sold-animation"
    );

  }
);


// ==================================================
// NEXT ANIMATION
// ==================================================

socket.on(
  "nextAnimation",
  () => {

    const el =
      $("auctionCard");

    el.classList.remove(
      "next-animation"
    );

    void el.offsetWidth;

    el.classList.add(
      "next-animation"
    );

  }
);


// ==================================================
// UNSOLD ANIMATION
// ==================================================

socket.on(
  "unsoldAnimation",
  () => {

    const el =
      $("auctionCard");

    el.classList.remove(
      "sold-animation"
    );

    void el.offsetWidth;

    el.classList.add(
      "sold-animation"
    );

  }
);


// ==================================================
// RENDER
// ==================================================

function render(){

  if(!state) return;


  const p =
    state.players[state.current];


  if(!p) return;


  // ==================================================
  // TEAMS
  // ==================================================

  $("teams").innerHTML =

    state.teams.map(t => `

      <div class="card team-card">

        <div class="team-top">

          <div class="team-name">
            ${t.name}
          </div>

          <span class="live-badge">
            TEAM
          </span>

        </div>


        <div class="team-label">
          REMAINING POINTS
        </div>


        <div class="team-budget">

          ${fmt(
            t.budget - t.spent
          )}

        </div>


        <div class="team-meta">

          Spent ${fmt(t.spent)}
          •
          ${t.players.length}
          players

        </div>


        <div class="team-divider"></div>


        ${
          t.players.length

          ?

          `

          <div class="bought-title">
            Players Bought
          </div>

          <div class="scroll">

            <table
              style="min-width:100%"
            >

              <thead>

                <tr>

                  <th>
                    Player
                  </th>

                  <th>
                    Bid
                  </th>

                </tr>

              </thead>


              <tbody>

                ${

                  t.players
                    .map(player => `

                      <tr>

                        <td>
                          ${player.name}
                        </td>

                        <td>
                          ${fmt(
                            player.amount
                          )}
                        </td>

                      </tr>

                    `)
                    .join("")

                }

              </tbody>

            </table>

          </div>

          `

          :

          `

          <div class="small">
            No players bought yet
          </div>

          `
        }

      </div>

    `).join("");


  // ==================================================
  // CURRENT PLAYER
  // ==================================================

  $("currentPlayer").textContent =
    p.name;


  $("currentNo").textContent =
    `Player ${state.current + 1}
     of ${state.players.length}
     • ${p.status}`;


  $("liveBid").textContent =
    fmt(
      state.liveBid || 200
    );


  if(
    state.liveBidTeam !== "" &&
    state.liveBidTeam !== null &&
    state.teams[state.liveBidTeam]
  ){

    $("liveTeam").textContent =
      "Current bid: " +
      state.teams[
        state.liveBidTeam
      ].name;

  }

  else{

    $("liveTeam").textContent =
      "Base price: 200";

  }


  // ==================================================
  // RESULT
  // ==================================================

  if(p.status === "sold"){

    $("result").innerHTML = `

      <div class="notice sold">

        🔨 SOLD

        —

        ${p.team}

        for

        ${fmt(p.amount)}

        points

      </div>

    `;

  }

  else if(
    p.status === "unsold"
  ){

    $("result").innerHTML = `

      <div class="notice unsold">

        ❌ UNSOLD

      </div>

    `;

  }

  else{

    $("result").innerHTML = `

      <div class="notice live">

        <span class="live-dot"></span>

        🔴 BIDDING LIVE

      </div>

    `;

  }


  // ==================================================
  // PLAYER RESULTS
  // ==================================================

  $("rows").innerHTML =

    state.players
      .map((p,i) => `

        <tr>

          <td>
            ${i + 1}
          </td>


          <td>
            ${p.name}
          </td>


          <td>

            <span
              class="status ${p.status}"
            >

              ${p.status}

            </span>

          </td>


          <td>
            ${p.team || "-"}
          </td>


          <td>

            ${
              p.amount
              ?
              fmt(p.amount)
              :
              "-"
            }

          </td>

        </tr>

      `)
      .join("");


  // ==================================================
  // ADMIN
  // ==================================================

  if(admin){

    // -----------------------------------------------
    // MAIN PLAYER
    // -----------------------------------------------

    $("selPlayer").innerHTML =

      state.players
        .map((p,i) => `

          <option
            value="${i}"

            ${
              i === state.current
              ? "selected"
              : ""
            }
          >

            ${i + 1}.
            ${p.name}
            —
            ${p.status}

          </option>

        `)
        .join("");


    // -----------------------------------------------
    // MAIN TEAM
    // -----------------------------------------------

    $("selTeam").innerHTML =

      state.teams
        .map((t,i) => `

          <option
            value="${i}"

            ${
              i === Number(
                state.liveBidTeam
              )
              ? "selected"
              : ""
            }
          >

            ${t.name}
            (
            ${fmt(
              t.budget - t.spent
            )}
            left)

          </option>

        `)
        .join("");


    // -----------------------------------------------
    // BID
    // -----------------------------------------------

    $("amount").value =
      state.liveBid || 200;


    // -----------------------------------------------
    // SOLD PLAYERS FOR EDIT
    // -----------------------------------------------

    const soldPlayers =
      state.players.filter(
        p =>
          p.status === "sold"
      );


    $("editPlayer").innerHTML =

      soldPlayers.length

      ?

      soldPlayers
        .map(p => {

          const index =
            state.players.indexOf(p);

          return `

            <option
              value="${index}"
            >

              ${index + 1}.
              ${p.name}
              —
              ${p.team}
              —
              ${fmt(p.amount)}

            </option>

          `;

        })
        .join("")

      :

      `

        <option value="">
          No sold players
        </option>

      `;


    // -----------------------------------------------
    // RENAME TEAM
    // -----------------------------------------------

    $("renameTeam").innerHTML =

      state.teams
        .map((t,i) => `

          <option value="${i}">
            ${t.name}
          </option>

        `)
        .join("");

  }

}


// ==================================================
// LIVE BID
// ==================================================

function bid(){

  if(!admin) return;


  socket.emit("bid", {

    amount:
      $("amount").value,

    team:
      $("selTeam").value

  });

}


// ==================================================
// SOLD
// ==================================================

function sold(){

  if(!admin) return;


  /*
     IMPORTANT:

     No confirmation popup.

     The currently selected
     Team + Bid Amount are used
     immediately.
  */

  socket.emit("sold", {

    amount:
      $("amount").value,

    team:
      $("selTeam").value

  });

}


// ==================================================
// UNSOLD
// ==================================================

function unsold(){

  if(!admin) return;


  socket.emit(
    "unsold"
  );

}


// ==================================================
// NEXT
// ==================================================

function next(){

  if(!admin) return;


  socket.emit(
    "next"
  );

}


// ==================================================
// UNDO
// ==================================================

function undoSale(){

  if(!admin) return;


  if(
    !confirm(
      "Undo the LAST SALE?\n\n" +
      "The player will return to pending " +
      "and the team's points will be restored."
    )
  ){

    return;

  }


  socket.emit(
    "undoSale"
  );

}


// ==================================================
// EDIT SALE
// ==================================================

function editSale(){

  if(!admin) return;


  const playerIndex =
    $("editPlayer").value;


  if(playerIndex === ""){

    showError(
      "There are no sold players to edit."
    );

    return;

  }


  const player =
    state.players[
      Number(playerIndex)
    ];


  if(!player){

    showError(
      "Player not found."
    );

    return;

  }


  /*
     Since New Team / New Bid fields
     were removed from the UI,
     use the existing auction controls
     for the correction.

     Select the player in Corrections,
     then choose the desired team and
     amount from the main auction controls.
  */

  const teamIndex =
    $("selTeam").value;


  const amount =
    $("amount").value;


  if(
    !confirm(
      `Edit ${player.name}?\n\n` +
      `Team: ${
        state.teams[
          Number(teamIndex)
        ].name
      }\n` +
      `Amount: ${amount}`
    )
  ){

    return;

  }


  socket.emit(
    "editSale",
    {

      playerIndex:
        Number(playerIndex),

      team:
        Number(teamIndex),

      amount:
        Number(amount)

    }
  );

}


// ==================================================
// EDIT PLAYER CHANGE
// ==================================================

$("editPlayer")
  .addEventListener(
    "change",
    () => {

      if(!state) return;


      const index =
        Number(
          $("editPlayer").value
        );


      const p =
        state.players[index];


      if(!p) return;


      /*
         Automatically load the
         player's current team and amount
         into the MAIN auction controls.
      */

      const teamIndex =
        state.teams.findIndex(
          t =>
            t.name === p.team
        );


      if(teamIndex >= 0){

        $("selTeam").value =
          teamIndex;

      }


      $("amount").value =
        p.amount || 200;

    }
  );


// ==================================================
// PLAYER SELECTION
// ==================================================

$("selPlayer")
  .addEventListener(
    "change",
    () => {

      if(!admin) return;


      socket.emit(
        "select",
        Number(
          $("selPlayer").value
        )
      );

    }
  );


// ==================================================
// RENAME TEAM
// ==================================================

function renameTeam(){

  if(!admin) return;


  const teamIndex =
    Number(
      $("renameTeam").value
    );


  const name =
    $("newTeamName")
      .value
      .trim();


  if(!name){

    showError(
      "Enter a new team name."
    );

    return;

  }


  socket.emit(
    "renameTeam",
    {

      team:
        teamIndex,

      name:
        name

    }
  );


  $("newTeamName").value = "";

}


// ==================================================
// EXCEL / CSV
// ==================================================

function downloadExcel(){

  if(!admin) return;


  if(!state){

    alert(
      "Auction data is not available."
    );

    return;

  }


  let csv = "";


  csv +=
    "CRICKET AUCTION FINAL SQUADS\n\n";


  csv +=
    "Team,Players Bought,Total Spent,Remaining Points\n";


  state.teams.forEach(team => {

    csv +=
      `"${team.name}",` +
      `${team.players.length},` +
      `${team.spent},` +
      `${team.budget - team.spent}\n`;

  });


  csv += "\n\n";


  csv +=
    "Team,Player,Bid Amount\n";


  state.teams.forEach(team => {

    team.players.forEach(player => {

      csv +=
        `"${team.name}",` +
        `"${player.name}",` +
        `${player.amount}\n`;

    });

  });


  csv += "\n\n";


  csv +=
    "Player,Status,Team,Bid Amount\n";


  state.players.forEach(player => {

    csv +=
      `"${player.name}",` +
      `"${player.status}",` +
      `"${player.team || ""}",` +
      `${player.amount || ""}\n`;

  });


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;


  a.download =
    "Cricket_Auction_Final_Squads.csv";


  document.body.appendChild(a);


  a.click();


  document.body.removeChild(a);


  URL.revokeObjectURL(url);

}

$("pin")
  .addEventListener(
    "keydown",
    e => {

      if(e.key === "Enter"){

        login();

      }

    }
  );
